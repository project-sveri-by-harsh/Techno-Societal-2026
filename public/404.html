<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Techno-Societal 2026</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #0f1b2e;
        color: white;
        font-family: 'Inter', sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 6rem;
        margin: 0;
        color: #00f0ff;
      }
      p {
        font-size: 1.5rem;
        margin-bottom: 2rem;
      }
      a {
        padding: 1rem 2rem;
        background-color: #ff00ea;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        transition: background-color 0.3s;
      }
      a:hover {
        background-color: #aa00ff;
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>Oops! The page you're looking for doesn't exist.</p>
    <a href="/">Go Back Home</a>
  </body>
</html>
